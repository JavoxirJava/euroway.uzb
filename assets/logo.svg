<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <!-- Glowing European path / Gateway icon -->
  <defs>
    <linearGradient id="euGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Compass / Route Shield -->
  <rect x="6" y="8" width="54" height="54" rx="16" fill="#1e293b" stroke="url(#euGrad)" stroke-width="2"/>
  <!-- Route curve and aircraft -->
  <path d="M18 48 C 22 30, 36 24, 48 20" stroke="url(#euGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Golden European Star -->
  <polygon points="46,17 48.5,22 54,22.5 50,26 51,31 46,28 41,31 42,26 38,22.5 43.5,22" fill="url(#goldGrad)"/>
  <circle cx="20" cy="46" r="3.5" fill="#38bdf8"/>
  <path d="M30 33 L38 27 L33 36 Z" fill="#60a5fa"/>

  <!-- Brand Typography -->
  <text x="72" y="38" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#ffffff">
    EURO<tspan fill="#38bdf8">WAY</tspan>
  </text>
  <text x="74" y="54" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="10.5" letter-spacing="3" fill="#94a3b8">
    CONSULTING AGENCY
  </text>
</svg>
